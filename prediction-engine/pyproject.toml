[project]
name = "prediction-engine"
version = "0.1.0"
description = "Football match prediction engine: data ingestion, models, backtesting and value-bet detection"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "scipy>=1.14",
    "sqlalchemy>=2.0",
]

[project.scripts]
predict = "prediction_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
