services:
  db:
    image: postgres:16-alpine
    container_name: sports-predictions-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: predictions
      POSTGRES_PASSWORD: predictions
      POSTGRES_DB: predictions
    ports:
      # Host port 5433 avoids clashing with any other Postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictions -d predictions"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
